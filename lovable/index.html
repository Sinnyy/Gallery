<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Gallery</title>

<style>
:root {
  --bg-color: #f4f4f4;
  --card-color: #ffffff;
  --text-color: #222;
  --accent: #4CAF50;
}

body.dark {
  --bg-color: #1e1e1e;
  --card-color: #2c2c2c;
  --text-color: #f4f4f4;
  --accent: #00c853;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg-color);
  color: var(--text-color);
  transition: background 0.3s ease, color 0.3s ease;
}

/* Toggle Button */
.toggle-container {
  text-align: center;
  margin: 20px;
}

button {
  padding: 10px 20px;
  border: none;
  cursor: pointer;
  background: var(--accent);
  color: white;
  border-radius: 5px;
  transition: transform 0.2s ease;
}

button:hover {
  transform: scale(1.05);
}

/* Gallery */
.gallery {
  display: flex;
  justify-content: center;
  gap: 20px;
  padding: 40px;
  flex-wrap: wrap;
}

/* Cards */
.card {
  background: var(--card-color);
  width: 280px;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  transform: translateY(20px);
  opacity: 0;
  transition: transform 0.4s ease, box-shadow 0.3s ease, opacity 1s ease;
}

.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
}

.card-content {
  padding: 15px;
}

.card h3 {
  margin: 10px 0;
}

.card p {
  font-size: 14px;
  color: gray;
}

.price {
  font-weight: bold;
  margin-top: 10px;
}

/* Hover Effect */
.card:hover {
  transform: translateY(-10px);
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

/* Fade-in Animation */
.card.show {
  transform: translateY(0);
  opacity: 1;
}
</style>
</head>

<body>

<div class="toggle-container">
  <button id="themeToggle">Toggle Theme</button>
</div>

<div class="gallery">
  <div class="card">
    <img src="https://picsum.photos/300/200?1" alt="Product 1">
    <div class="card-content">
      <h3>Product One</h3>
      <p>High quality product for everyday use.</p>
      <div class="price">$29.99</div>
    </div>
  </div>

  <div class="card">
    <img src="https://picsum.photos/300/200?2" alt="Product 2">
    <div class="card-content">
      <h3>Product Two</h3>
      <p>Modern design and premium materials.</p>
      <div class="price">$49.99</div>
    </div>
  </div>

  <div class="card">
    <img src="https://picsum.photos/300/200?3" alt="Product 3">
    <div class="card-content">
      <h3>Product Three</h3>
      <p>Perfect combination of style and comfort.</p>
      <div class="price">$69.99</div>
    </div>
  </div>
</div>

<script>
// Theme Toggle
const toggleBtn = document.getElementById("themeToggle");

toggleBtn.addEventListener("click", () => {
  document.body.classList.toggle("dark");
});

// Fade-in animation on load
window.addEventListener("DOMContentLoaded", () => {
  const cards = document.querySelectorAll(".card");
  cards.forEach((card, index) => {
    setTimeout(() => {
      card.classList.add("show");
    }, index * 300);
  });
});
</script>

</body>
</html>
