<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Reusable Pricing Cards</title>

<style>
body {
  background-color: #f4f4f4;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
  padding: 40px;
}

.pricing {
  width: 300px;
  background-color: #fff;
  box-shadow: 0 0 10px #ccc;
  padding: 20px;
  border-radius: 8px;
  transition: transform 0.3s ease;
}

.pricing:hover {
  transform: translateY(-5px);
}

.title {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 10px;
}

.price {
  font-size: 18px;
  color: green;
  margin-bottom: 15px;
}

.features {
  list-style: none;
  padding-left: 0;
}

.features li {
  padding: 8px 0;
  border-bottom: 1px solid #eee;
}

.features li:last-child {
  border-bottom: none;
}

.btn {
  background: blue;
  color: white;
  padding: 10px 20px;
  border: none;
  margin-top: 15px;
  cursor: pointer;
  border-radius: 5px;
  transition: background 0.3s ease;
  width: 100%;
}

.btn:hover {
  background: darkblue;
}
</style>
</head>
<body>

<div id="pricing-container"></div>

<script>
// Reusable Card Component
function Card(title, price, features) {
  const card = document.createElement("div");
  card.className = "pricing";

  const featureList = features
    .map(feature => `<li>${feature}</li>`)
    .join("");

  card.innerHTML = `
    <h2 class="title">${title}</h2>
    <p class="price">$${price} /month</p>
    <ul class="features">
      ${featureList}
    </ul>
    <button class="btn">Start Trial</button>
  `;

  return card;
}

// Render Cards
const container = document.getElementById("pricing-container");

container.appendChild(
  Card("Basic Plan", 9.99, [
    "1 GB Storage",
    "Basic Support",
    "All Core Features"
  ])
);

container.appendChild(
  Card("Pro Plan", 19.99, [
    "10 GB Storage",
    "Priority Support",
    "Advanced Features"
  ])
);

container.appendChild(
  Card("Enterprise Plan", 49.99, [
    "Unlimited Storage",
    "24/7 Support",
    "All Premium Features"
  ])
);
</script>

</body>
</html>
